<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Porto Connect - Vagas</title>
<link rel="stylesheet" href="../css/home_aluno.css"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="https://unpkg.com/lucide@latest"></script>
<script src="../js/db.js"></script>
<style>
.vagas-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; margin-top: 30px; }
.search-bar { margin-top: 20px; display: flex; gap: 10px; }
.search-bar input { flex: 1; padding: 16px; border: 1px solid #e5e7eb; border-radius: 12px; font-size: 16px; outline: none; }
.search-bar button { padding: 16px 24px; background: #2563eb; color: white; border: none; border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer; transition: 0.3s; }
.search-bar button:hover { background: #1d4ed8; }
.card.job { display: flex; flex-direction: column; justify-content: space-between; height: 100%; }
.job-actions { margin-top: 20px; display: flex; gap: 10px; }
.job-actions button { flex: 1; padding: 10px; border-radius: 8px; font-weight: 600; cursor: pointer; border: none; transition: 0.3s; }
.btn-apply { background: #2563eb; color: white; }
.btn-apply:hover { background: #1d4ed8; }
.btn-save { background: #f3f4f6; color: #4b5563; }
.btn-save:hover { background: #e5e7eb; }

/* Modal de Sucesso */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(15,23,42,0.45);
  backdrop-filter: blur(4px);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 1000;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s;
}
.modal-overlay.open {
  opacity: 1;
  pointer-events: all;
}
.modal-success {
  background: white;
  border-radius: 20px;
  padding: 35px 30px;
  text-align: center;
  max-width: 400px;
  width: 90%;
  box-shadow: 0 20px 50px rgba(15,23,42,0.15);
  transform: scale(0.9);
  transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.modal-overlay.open .modal-success {
  transform: scale(1);
}
.modal-success .success-icon {
  width: 60px;
  height: 60px;
  background: #dcfce7;
  color: #15803d;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 28px;
  margin: 0 auto 20px;
}
.modal-success h2 { margin-bottom: 10px; font-weight: 700; color: #1e1b4b; font-size: 22px; }
.modal-success p { color: #6b7280; font-size: 15px; line-height: 1.5; margin-bottom: 24px; }
.modal-success button {
  background: #2563eb;
  color: white;
  border: none;
  padding: 12px 24px;
  border-radius: 10px;
  font-weight: 600;
  cursor: pointer;
  width: 100%;
  transition: 0.2s;
}
.modal-success button:hover { background: #1d4ed8; }

/* Botão Candidatado */
.btn-apply.candidatado {
  background: #e2e8f0 !important;
  color: #64748b !important;
  cursor: not-allowed;
  box-shadow: none !important;
}

/* Botão Favoritado */
.btn-save.favoritado {
  background: #fef3c7 !important;
  color: #d97706 !important;
}
</style>
</head>
<body>
  <header class="navbar">
    <div class="nav-inner">
      <a href="./home_aluno.html" class="brand" aria-label="Porto Connect">
        <img src="../assets/images/logo.png" alt="Porto Connect" height="34" class="brand-logo" />
      </a>

      <nav class="nav-links" id="navLinks">
        <a href="./home_aluno.html">Dashboard</a>
        <a href="./portfolio.html">Portfólio</a>
        <a href="./vagas.html" class="active">Vagas</a>
        <a href="./candidaturas.html">Candidaturas</a>
        <a href="./perfil_aluno.html">Perfil</a>
        <a href="./login_aluno.html" class="logout"><i data-lucide="log-out"></i> Sair</a>
      </nav>

      <button class="menu-toggle" id="menuToggle" aria-label="Abrir menu">
        <i data-lucide="menu"></i>
      </button>
    </div>
  </header>

  <main class="container">
    <section class="hero" style="padding-bottom: 20px;">
      <h1>Vagas Disponíveis</h1>
      <p>Encontre oportunidades compatíveis com o seu perfil</p>
      
      <div class="search-bar">
        <input type="text" id="searchInput" placeholder="Buscar por cargo, tecnologia ou empresa...">
        <button id="searchBtn">Buscar</button>
      </div>
    </section>

    <section class="vagas-grid" id="jobGrid"></section>
  </main>

  <!-- Modal de Sucesso -->
  <div class="modal-overlay" id="successModal">
    <div class="modal-success">
      <div class="success-icon">
        <i data-lucide="check"></i>
      </div>
      <h2>Candidatura Enviada!</h2>
      <p>Você se candidatou com sucesso para a vaga de <strong id="modalJobTitle"></strong>.</p>
      <button id="closeModalBtn">Entendido</button>
    </div>
  </div>

  <script>
    lucide.createIcons();
    document.getElementById('menuToggle').addEventListener('click', () => {
      document.getElementById('navLinks').classList.toggle('active');
    });

    const searchInput = document.getElementById('searchInput');
    const searchBtn = document.getElementById('searchBtn');

    function renderJobs(jobList) {
      const grid = document.getElementById('jobGrid');
      grid.innerHTML = '';
      if (jobList.length === 0) {
        grid.innerHTML = `
          <div style="grid-column: 1 / -1; text-align: center; padding: 40px; background: white; border-radius: 18px; border: 1px dashed #cbd5e1; color: #64748b;">
            <p style="font-size: 16px; font-weight: 500; margin-bottom: 8px;">Nenhuma vaga publicada pelas empresas ainda.</p>
            <p style="font-size: 14px; color: #94a3b8;">Aguarde enquanto as empresas publicam oportunidades reais.</p>
          </div>
        `;
        return;
      }

      const alunoLogado = JSON.parse(alunoLogadoRaw || '{}');
      const studentSkills = alunoLogado.skills || '';

      jobList.forEach(job => {
        const matchPercent = db.calculateMatch(job.skills || '', studentSkills);
        const matchClass = matchPercent > 70 ? 'style="color: #16a34a;"' : matchPercent > 40 ? 'style="color: #ca8a04;"' : 'style="color: #64748b;"';

        const article = document.createElement('article');
        article.className = 'card job';
        article.innerHTML = `
          <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px;">
            <span class="badge" style="background: #dbeafe; color: #1e40af; padding: 4px 10px; border-radius: 12px; font-size: 12px; font-weight: 600;">${job.categoria || 'Geral'}</span>
            <div style="text-align: right;">
              <div style="font-size: 9px; font-weight: 700; text-transform: uppercase; color: #94a3b8;">Smart Match</div>
              <div ${matchClass} style="font-size: 16px; font-weight: 800;">${matchPercent}%</div>
            </div>
          </div>
          <h3>${job.titulo}</h3>
          <p>${job.empresa}</p>
          <p class="small-text" style="color: #6b7280; font-size: 14px; margin-top: 4px;">${job.modelo} • ${job.tipo}</p>
          <p style="margin-top: 12px; color: #374151; line-height: 1.6; flex-grow: 1;">${job.descricao || 'Descrição não informada.'}</p>
          <div class="job-actions">
            <button class="btn-apply"></button>
            <button class="btn-save"><i class="fa-regular fa-bookmark" style="font-size: 18px;"></i></button>
          </div>
        `;

        const btnApply = article.querySelector('.btn-apply');
        const btnSave = article.querySelector('.btn-save');
        const alreadyApplied = candidaturas.some(cand => cand.titulo === job.titulo && cand.empresa === job.empresa);
        if (alreadyApplied) {
          btnApply.innerText = 'Candidatado';
          btnApply.classList.add('candidatado');
          btnApply.disabled = true;
        } else {
          btnApply.innerText = 'Candidatar-se';
          btnApply.addEventListener('click', () => candidatar(job, btnApply));
        }

        const alreadySaved = favoritos.some(fav => fav.titulo === job.titulo && fav.empresa === job.empresa);
        if (alreadySaved) {
          btnSave.classList.add('favoritado');
          btnSave.innerHTML = '<i class="fa-solid fa-bookmark" style="font-size: 16px;"></i>';
        }
        btnSave.addEventListener('click', () => toggleFavorito(job, btnSave));

        grid.appendChild(article);
      });
    }

    function filterJobs() {
      const term = searchInput.value.toLowerCase();
      document.querySelectorAll('.card.job').forEach(card => {
        const text = card.innerText.toLowerCase();
        if (text.includes(term)) {
          card.style.display = 'flex';
        } else {
          card.style.display = 'none';
        }
      });
    }

    searchBtn.addEventListener('click', async () => {
      renderJobs(await getFilteredJobs());
    });
    searchInput.addEventListener('keyup', async (e) => {
      if (e.key === 'Enter') renderJobs(await getFilteredJobs());
    });
    searchInput.addEventListener('input', async () => renderJobs(await getFilteredJobs()));

    async function getFilteredJobs() {
      const term = searchInput.value.toLowerCase();
      const allJobs = (await db.getAllCompanyVacancies()).filter(job => job.status === 'Ativa');
      return allJobs.filter(job => {
        const text = `${job.titulo} ${job.empresa || job.company_name || ''} ${job.categoria || ''} ${job.tipo || ''} ${job.modelo || ''} ${job.descricao || ''}`.toLowerCase();
        return text.includes(term);
      });
    }

    const alunoLogadoRaw = localStorage.getItem('aluno_logado');
    if (!alunoLogadoRaw) {
      window.location.href = 'login_aluno.html';
    }
    const alunoLogado = JSON.parse(alunoLogadoRaw || '{}');
    const userEmail = alunoLogado.email || 'convidado';
    const candidaturasKey = `candidaturas_${userEmail}`;
    let candidaturas = [];
    let favoritos = [];

    async function toggleFavorito(job, button) {
      if (!alunoLogadoRaw) {
        alert('Você precisa estar logado para favoritar vagas!');
        window.location.href = 'login_aluno.html';
        return;
      }

      const title = job.titulo;
      const company = job.empresa || job.company_name || '';
      const idx = favoritos.findIndex(fav => fav.titulo === title && fav.empresa === company);
      const vacancy = {
        titulo: title,
        empresa: company,
        company_email: job.company_email || '',
        categoria: job.categoria,
        tipo: job.tipo,
      };
      if (idx !== -1) {
        const result = await db.removeStudentFavorite(userEmail, title, company);
        if (!result.error) {
          favoritos = result.data;
        }
        button.classList.remove('favoritado');
        button.innerHTML = '<i class="fa-regular fa-bookmark" style="font-size: 16px;"></i>';
      } else {
        const result = await db.addStudentFavorite(userEmail, vacancy);
        if (!result.error) {
          favoritos.push(result.data);
        }
        button.classList.add('favoritado');
        button.innerHTML = '<i class="fa-solid fa-bookmark" style="font-size: 16px;"></i>';
      }
    }

    async function candidatar(job, button) {
      if (!alunoLogadoRaw) {
        alert('Você precisa estar logado para se candidatar!');
        window.location.href = 'login_aluno.html';
        return;
      }

      const title = job.titulo;
      const company = job.empresa || job.company_name || '';
      const novaCandidatura = {
        titulo: title,
        empresa: company,
        company_email: job.company_email || '',
        emailAluno: alunoLogado.email,
        status: 'Pendente',
        data: new Date().toLocaleDateString('pt-BR'),
        diasAtras: 0
      };

      const result = await db.applyToVacancy(novaCandidatura);
      if (result.error) {
        alert(result.error.message || 'Erro ao enviar candidatura. Tente novamente.');
        return;
      }

      candidaturas = await db.normalizeStudentApplications(userEmail);

      button.innerText = 'Candidatado';
      button.classList.add('candidatado');
      button.disabled = true;

      const modal = document.getElementById('successModal');
      const modalJobTitle = document.getElementById('modalJobTitle');
      modalJobTitle.innerText = title;
      modal.classList.add('open');
    }

    document.getElementById('closeModalBtn').addEventListener('click', () => {
      document.getElementById('successModal').classList.remove('open');
    });

    async function initPage() {
      candidaturas = await db.normalizeStudentApplications(userEmail);
      favoritos = await db.getStudentFavorites(userEmail);
      renderJobs(await getFilteredJobs());
    }

    // Inicializar com as vagas já publicadas pelas empresas
    initPage();

    document.querySelector('.logout')?.addEventListener('click', async function(e) {
      e.preventDefault();
      if (confirm("Deseja sair da plataforma?")) {
        await db.signOut();
        window.location.href = 'login_aluno.html';
      }
    });
  </script>
</body>
</html>
