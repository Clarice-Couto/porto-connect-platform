<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Porto Connect - Nova Vaga</title>
<link rel="stylesheet" href="../css/home_aluno.css"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<script src="../js/db.js"></script>
<style>
.form-container { max-width: 600px; margin: 40px auto; background: white; padding: 40px; border-radius: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); }
.form-group { margin-bottom: 20px; }
.form-group label { display: block; margin-bottom: 8px; font-weight: 600; color: #374151; }
.form-group input, .form-group textarea, .form-group select { width: 100%; padding: 12px; border: 1px solid #d1d5db; border-radius: 10px; font-size: 15px; outline: none; transition: 0.3s; background: white; }
.form-group input:focus, .form-group textarea:focus, .form-group select:focus { border-color: #2563eb; }
.form-group textarea { height: 120px; resize: vertical; }
.btn-submit { width: 100%; padding: 14px; background: #2563eb; color: white; border: none; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; transition: 0.3s; }
.btn-submit:hover { background: #1d4ed8; }
.btn-cancel { display: block; text-align: center; margin-top: 16px; color: #6b7280; text-decoration: none; font-weight: 500; }
.btn-cancel:hover { color: #374151; text-decoration: underline; }
</style>
</head>
<body>
  <header class="navbar">
    <div class="nav-inner">
      <a href="./home_empresa.html" class="brand" aria-label="Porto Connect">
        <img src="../assets/images/logo.png" alt="Porto Connect" height="34" class="brand-logo" />
      </a>

      <nav class="nav-links" id="navLinks">
        <a href="./home_empresa.html">Candidatos</a>
        <a href="./vagas_empresa.html" class="active">Minhas Vagas</a>
        <a href="./perfil_empresa.html">Perfil</a>
        <a href="./login_empresa.html" class="logout"><i data-lucide="log-out"></i> Sair</a>
      </nav>

      <button class="menu-toggle" id="menuToggle" aria-label="Abrir menu">
        <i data-lucide="menu"></i>
      </button>
    </div>
  </header>

  <main class="container">
    <div class="form-container">
      <h1 style="margin-bottom: 24px; font-size: 28px;">Publicar / Editar Vaga</h1>
      <form action="vagas_empresa.html" method="get">
        <div class="form-group">
          <label for="titulo">Título da Vaga</label>
          <input type="text" id="titulo" placeholder="Ex: Desenvolvedor Front-end Jr." required>
        </div>
        
        <div class="form-group" style="display: flex; gap: 16px;">
          <div style="flex: 1;">
            <label for="tipo">Tipo de Contrato</label>
            <select id="tipo">
              <option>CLT (Full-time)</option>
              <option>PJ (Full-time)</option>
              <option>Estágio</option>
              <option>Part-time</option>
            </select>
          </div>
          <div style="flex: 1;">
            <label for="modelo">Modelo</label>
            <select id="modelo">
              <option>Remoto</option>
              <option>Híbrido</option>
              <option>Presencial</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label for="descricao">Descrição da Vaga</label>
          <textarea id="descricao" placeholder="Descreva as responsabilidades e requisitos da vaga..." required></textarea>
        </div>

        <div class="form-group">
          <label for="tags">Categoria Principal</label>
          <select id="tags">
            <option>Frontend</option>
            <option>Backend</option>
            <option>Full Stack</option>
            <option>Data</option>
            <option>Design/UI/UX</option>
          </select>
        </div>

        <button type="submit" class="btn-submit">Salvar Vaga</button>
        <a href="vagas_empresa.html" class="btn-cancel">Cancelar</a>
      </form>
    </div>
  </main>

  <script>
    lucide.createIcons();
    document.getElementById('menuToggle').addEventListener('click', () => {
      document.getElementById('navLinks').classList.toggle('active');
    });

  document.querySelector('form').addEventListener('submit', async function(e) {
    e.preventDefault();
    const empresa = db.getCurrentCompany();
    if (!empresa || !empresa.email) {
      window.location.href = 'login_empresa.html';
      return;
    }

    const titulo = document.getElementById('titulo').value.trim();
    const tipo = document.getElementById('tipo').value;
    const modelo = document.getElementById('modelo').value;
    const descricao = document.getElementById('descricao').value.trim();
    const categoria = document.getElementById('tags').value;

    const vacancy = {
      id: crypto?.randomUUID ? crypto.randomUUID() : String(Date.now()),
      titulo,
      tipo,
      modelo,
      descricao,
      categoria,
      empresa: empresa.nome,
      company_name: empresa.nome,
      company_email: empresa.email,
      status: 'Ativa'
    };

    const res = await db.addCompanyVacancy(empresa.email, vacancy);
    if (res.error) {
      alert(res.error.message || 'Erro ao publicar vaga.');
      return;
    }
    window.location.href = 'vagas_empresa.html';
  });

  const logoutBtn = document.querySelector('.logout');
  if (logoutBtn) {
    logoutBtn.addEventListener('click', async function(e) {
      e.preventDefault();
      const confirmar = confirm("Deseja sair da plataforma?");
      if (confirmar) {
        await db.signOut();
        window.location.href = 'login_empresa.html';
      }
    });
  }
</script>
</body>
</html>
