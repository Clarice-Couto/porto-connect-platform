<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Porto Connect - Dashboard da Empresa</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/home_aluno.css"/>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

  <header class="navbar">
    <div class="nav-inner">
      <a href="./home_empresa.html" class="brand" aria-label="Porto Connect">
        <img src="../assets/images/logo.png" alt="Porto Connect" height="34" class="brand-logo" />
      </a>

      <nav class="nav-links" id="navLinks">
        <a href="./home_empresa.html" class="active">Candidatos</a>
        <a href="./vagas_empresa.html">Minhas Vagas</a>
        <a href="./perfil_empresa.html">Perfil</a>
        <a href="./login_empresa.html" class="logout"><i data-lucide="log-out"></i> Sair</a>
      </nav>

      <button class="menu-toggle" id="menuToggle" aria-label="Abrir menu">
        <i data-lucide="menu"></i>
      </button>
    </div>
  </header>

  <main class="container">

    <h1 class="title">Dashboard da Empresa</h1>
    <p class="subtitle">
      Gerencie suas vagas e encontre os melhores talentos
    </p>


    <section class="stats">

      <div class="card">
        <div class="icon">👥</div>

        <h4>Total de Candidatos</h4>

        <div class="number">3</div>

        <p>Disponíveis na plataforma</p>
      </div>



      <div class="card">
        <div class="icon">💼</div>

        <h4>Vagas Ativas</h4>

        <div class="number">4</div>

        <p>Publicadas</p>
      </div>

    </section>

    <section class="filter-box">

      <h2 class="filter-title">Buscar Candidatos</h2>

      <div class="filters">

        <div class="input-group">
          <label>Buscar</label>
          <input type="text" id="filterName" placeholder="Nome do candidato..." />
        </div>

        <div class="input-group">
          <label>Habilidade</label>

          <select id="filterSkill">
            <option value="">Todas</option>
            <option value="react">React</option>
            <option value="python">Python</option>
            <option value="javascript">JavaScript</option>
            <option value="java">Java</option>
            <option value="sql">SQL</option>
            <option value="sap">SAP</option>
          </select>
        </div>

        <div class="input-group">
          <label>Status</label>

          <select id="filterLevel">
            <option value="">Todos</option>
            <option value="pendente">Pendente</option>
            <option value="entrevista">Entrevista</option>
            <option value="contratado">Contratado</option>
            <option value="recusado">Recusado</option>
          </select>
        </div>

      </div>

      <div class="results" id="resultsCount">
        0 candidatos encontrados
      </div>


      <div class="candidate-grid" id="candidateGrid">
        <!-- Candidatos preenchidos dinamicamente -->
      </div>

    </section>

  </main>

  <script>
    lucide.createIcons();
    document.getElementById('menuToggle')?.addEventListener('click', () => {
      document.getElementById('navLinks').classList.toggle('active');
    });

    const filterName = document.getElementById('filterName');
    const filterSkill = document.getElementById('filterSkill');
    const filterLevel = document.getElementById('filterLevel');
    const resultsCount = document.getElementById('resultsCount');

    function filterCandidates() {
      const nameTerm = filterName.value.toLowerCase();
      const skillTerm = filterSkill.value.toLowerCase();
      const levelTerm = filterLevel.value.toLowerCase();
      const cards = Array.from(document.querySelectorAll('.candidate-card'));

      let visibleCount = 0;

      cards.forEach(card => {
        const name = card.querySelector('h3').innerText.toLowerCase();

        const skills = Array.from(card.querySelectorAll('.tag')).map(t => t.innerText.toLowerCase());
        const hasSkill = skillTerm === "" || skills.some(tag => tag.includes(skillTerm));

        const level = card.querySelector('.level').innerText.toLowerCase();
        const hasLevel = levelTerm === "" || level.includes(levelTerm);

        if (name.includes(nameTerm) && hasSkill && hasLevel) {
          card.style.display = '';
          visibleCount++;
        } else {
          card.style.display = 'none';
        }
      });

      resultsCount.innerText = `${visibleCount} candidato${visibleCount !== 1 ? 's' : ''} encontrado${visibleCount !== 1 ? 's' : ''}`;
    }

    function getAllApplications() {
      return Object.keys(localStorage)
        .filter(key => key.startsWith('candidaturas_'))
        .flatMap(key => JSON.parse(localStorage.getItem(key) || '[]'));
    }

    function getStudentByEmail(email) {
      const usuarios = JSON.parse(localStorage.getItem('usuarios_aluno') || '[]');
      return usuarios.find(user => user.email === email) || null;
    }

    function updateApplicationStatus(emailAluno, titulo, novoStatus) {
      const key = `candidaturas_${emailAluno}`;
      const apps = JSON.parse(localStorage.getItem(key) || '[]');
      let changed = false;
      for (let i = 0; i < apps.length; i++) {
        const a = apps[i];
        if (a.titulo === titulo && a.empresa === (window.empresaLogada ? window.empresaLogada.nome : a.empresa)) {
          a.status = novoStatus;
          apps[i] = a;
          changed = true;
          break;
        }
      }
      if (changed) {
        localStorage.setItem(key, JSON.stringify(apps));
        // Re-render dashboard to reflect change
        renderDashboard(window.empresaLogada ? window.empresaLogada.nome : '', window.empresaLogada ? window.empresaLogada.email : '');
      }
    }

    window.updateApplicationStatusFromSelect = function(el) {
      const email = el.dataset.email;
      const title = el.dataset.title;
      const status = el.value;
      updateApplicationStatus(email, title, status);
    }

    function renderCandidateCards(applications) {
      const container = document.getElementById('candidateGrid');
      container.innerHTML = '';

      if (applications.length === 0) {
        container.innerHTML = `
          <div style="text-align: center; grid-column: 1 / -1; padding: 40px; background: white; border-radius: 18px; border: 1px dashed #cbd5e1; color: #64748b;">
            <i class="fa-regular fa-user" style="font-size: 40px; margin-bottom: 15px; display: block; color: #94a3b8;"></i>
            <p style="font-size: 16px; font-weight: 500; margin-bottom: 8px;">Nenhum candidato encontrado para suas vagas.</p>
            <a href="vagas_empresa.html" style="color: #2563eb; font-weight: 600; text-decoration: none;">Ver minhas vagas</a>
          </div>
        `;
        return;
      }

      applications.forEach(app => {
        const student = getStudentByEmail(app.emailAluno) || { nome: 'Candidato anônimo', email: app.emailAluno || '---', cidade: 'Não informado', skills: '' };
        const skills = (student.skills || '').split(',').map(s => s.trim()).filter(Boolean);
        const skillsHTML = skills.length > 0 ? skills.map(skill => `<div class="tag">${skill}</div>`).join('') : '<div class="tag">Nenhuma habilidade informada</div>';

        const card = document.createElement('div');
        card.className = 'candidate-card';
        card.style.cursor = 'pointer';
        card.innerHTML = `
          <div class="candidate-top">
            <div class="profile">
              <div class="avatar">${student.nome.split(' ').map(p => p.charAt(0)).join('').substring(0,2).toUpperCase()}</div>
              <div class="candidate-info">
                <h3>${student.nome}</h3>
                <span>${student.cidade}</span>
              </div>
            </div>
            <div style="text-align: right; min-width: 120px;">
              <span class="badge" style="background: #eff6ff; color: #2563eb; padding: 6px 14px; border-radius: 12px; font-weight: 700;">${app.status}</span>
            </div>
          </div>
          <p class="description">Candidato inscrito para a vaga de <strong>${app.titulo}</strong>.</p>
          <div class="tags">${skillsHTML}</div>
          <div class="candidate-footer">
            <div class="projects">⭐ ${skills.length} habilidade${skills.length !== 1 ? 's' : ''}</div>
            <div class="level">${app.emailAluno || 'E-mail não disponível'}</div>
          </div>
          <div class="candidate-actions" style="margin-top:12px; display:flex; gap:8px; align-items:center; justify-content:flex-end;">
            <label style="font-weight:600; font-size:13px; color:#475569; margin-right:8px;">Status:</label>
            <select class="status-select" data-email="${app.emailAluno}" data-title="${app.titulo}" onchange="window.updateApplicationStatusFromSelect && window.updateApplicationStatusFromSelect(this)" style="padding:6px 10px; border-radius:8px; border:1px solid #cbd5e1; background:white;">
              <option value="Pendente" ${app.status === 'Pendente' ? 'selected' : ''}>Pendente</option>
              <option value="Entrevista" ${app.status === 'Entrevista' ? 'selected' : ''}>Entrevista</option>
              <option value="Contratado" ${app.status === 'Contratado' ? 'selected' : ''}>Contratado</option>
              <option value="Recusado" ${app.status === 'Recusado' ? 'selected' : ''}>Recusado</option>
            </select>
          </div>
        `;
        card.querySelector('.candidate-top').addEventListener('click', () => window.location.href = 'detalhes_candidato.html');
        container.appendChild(card);
      });
    }

    function renderDashboard(companyName, companyEmail) {
      const jobs = JSON.parse(localStorage.getItem(`vagas_${companyEmail}`) || '[]');
      const apps = getAllApplications().filter(app => app.empresa === companyName);

      document.querySelector('.stats .card:nth-child(1) .number').innerText = apps.length;
      document.querySelector('.stats .card:nth-child(2) .number').innerText = jobs.filter(job => job.status === 'Ativa').length;
      resultsCount.innerText = `${apps.length} candidato${apps.length !== 1 ? 's' : ''} encontrado${apps.length !== 1 ? 's' : ''}`;
      renderCandidateCards(apps);
    }

    filterName.addEventListener('input', filterCandidates);
    filterSkill.addEventListener('change', filterCandidates);
    filterLevel.addEventListener('change', filterCandidates);

    // Verificar se a empresa está logada
    (function() {
      const empresaLogadaRaw = localStorage.getItem('empresa_logado');
      if (!empresaLogadaRaw) {
        window.location.href = 'login_empresa.html';
        return;
      }
      window.empresaLogada = JSON.parse(empresaLogadaRaw);
      const subTitle = document.querySelector('.subtitle');
      if (subTitle) {
        subTitle.innerHTML = `Bem-vindo(a), <strong>${window.empresaLogada.nome}</strong>! Gerencie suas vagas e encontre os melhores talentos.`;
      }
      renderDashboard(window.empresaLogada.nome, window.empresaLogada.email);
      const logoutBtn = document.querySelector('.logout');
      if (logoutBtn) {
        logoutBtn.addEventListener('click', function(e) {
          e.preventDefault();
          const confirmar = confirm("Deseja sair da plataforma?");
          if (confirmar) {
            localStorage.removeItem('empresa_logado');
            window.location.href = 'login_empresa.html';
          }
        });
      }
    })();
  </script>
</body>
</html>
