<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Porto Connect - Dashboard do Aluno</title>
  <link rel="stylesheet" href="../css/home_aluno.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>
  <header class="navbar">
    <div class="nav-inner">
      <a href="./home_aluno.html" class="brand" aria-label="Porto Connect">
        <img src="../assets/images/logo.png" alt="Porto Connect" height="34" class="brand-logo" />
      </a>

      <nav class="nav-links" id="navLinks">
        <a href="./home_aluno.html" class="active">Dashboard</a>
        <a href="./portfolio.html">Portfólio</a>
        <a href="./vagas.html">Vagas</a>
        <a href="./candidaturas.html">Candidaturas</a>
        <a href="./perfil_aluno.html">Perfil</a>
        <a href="./login_aluno.html" class="logout"><i data-lucide="log-out"></i> Sair</a>
      </nav>

      <button class="menu-toggle" id="menuToggle" aria-label="Abrir menu">
        <i data-lucide="menu"></i>
      </button>
    </div>
  </header>

  <main class="container">
    <section class="hero">
      <h1>Olá! <span class="wave">👋</span></h1>
      <p>Aqui está um resumo da sua jornada</p>
    </section>

    <section class="stats">


      <article class="card stat">
        <div class="stat-head">
          <span>Projetos</span>
          <i data-lucide="folder-git-2" class="icon-blue"></i>
        </div>
        <div class="stat-value">2</div>
        <div class="stat-sub">Projetos no portfólio</div>
      </article>

      <article class="card stat">
        <div class="stat-head">
          <span>Candidaturas</span>
          <i data-lucide="briefcase" class="icon-blue"></i>
        </div>
        <div class="stat-value">2</div>
        <div class="stat-sub">Vagas aplicadas</div>
      </article>

      <article class="card stat">
        <div class="stat-head">
          <span>Habilidades</span>
          <i data-lucide="check-circle-2" class="icon-green"></i>
        </div>
        <div class="stat-value">5</div>
        <div class="stat-sub">Tecnologias dominadas</div>
      </article>
    </section>

    <section class="grid-main">
      <div class="col">
        <div class="section-head">
          <h2>Projetos recentes</h2>
          <a href="./portfolio.html" class="link">Ver todos</a>
        </div>

        <div class="cards-row"></div>
      </div>

      <div class="col sidebar">
        <div class="section-head">
          <h2>Oportunidades</h2>
          <a href="./vagas.html" class="link">Ver todas</a>
        </div>

        <div class="cards-col" id="opportunityGrid"></div>
      </div>
    </section>

    <section class="applications">
      <div class="section-head">
        <h2>Minhas Candidaturas</h2>
        <a href="./candidaturas.html" class="link">Ver todas</a>
      </div>

      <div class="apps-row"></div>
    </section>
  </main>

  <script src="../js/init-supabase.js"></script>
  <script src="../js/db.js"></script>
  <script src="../js/script_dashboard.js"></script>
  <script>
    (async function () {
      const alunoLogadoRaw = localStorage.getItem('aluno_logado');
      if (!alunoLogadoRaw) {
        window.location.href = 'login_aluno.html';
        return;
      }
      const alunoLogado = JSON.parse(alunoLogadoRaw);
      const h1Greeting = document.querySelector('.hero h1');
      if (h1Greeting) {
        h1Greeting.innerHTML = `Olá, ${alunoLogado.nome}! <span class="wave">👋</span>`;
      }

      // Renderizar projetos recentes dinamicamente
      const projectsRow = document.querySelector('.cards-row');
      if (projectsRow) {
        const projetos = await db.getStudentProjects(alunoLogado.email);
        projectsRow.innerHTML = '';

        if (projetos.length === 0) {
          projectsRow.innerHTML = `
            <div style="grid-column: 1 / -1; padding: 30px; background: white; border-radius: 18px; border: 1px dashed #cbd5e1; text-align: center; color: #64748b; width: 100%;">
              <p style="font-weight: 500; margin-bottom: 8px;">Nenhum projeto no seu portfólio.</p>
              <a href="./portfolio.html" style="color: #2563eb; font-weight: 600; text-decoration: none; font-size: 14px;">Ir para o Portfólio</a>
            </div>
          `;
        } else {
          const dashboardProjetos = projetos.slice(0, 2);
          dashboardProjetos.forEach(proj => {
            const article = document.createElement('article');
            article.className = 'card project';

            const tagsArr = (proj.tags || '').split(',').map(t => t.trim()).filter(Boolean);
            const tagsHTML = tagsArr.map(tag => `<span>${tag}</span>`).join('');

            const repoBtn = proj.link
              ? `<button class="icon-btn" aria-label="Ver no GitHub" onclick="window.open('${proj.link}', '_blank')"><i data-lucide="github"></i></button>`
              : '';

            article.innerHTML = `
              <div class="project-head">
                <h3>${proj.titulo}</h3>
                ${repoBtn}
              </div>
              <p>${proj.descricao.length > 110 ? proj.descricao.substring(0, 110) + '...' : proj.descricao}</p>
              <div class="tags">${tagsHTML}</div>
            `;
            projectsRow.appendChild(article);
          });
        }

        const projectStat = document.querySelectorAll('.stat-value')[0];
        if (projectStat) {
          projectStat.innerText = projetos.length;
        }
      }

      // Atualizar estatística de Habilidades (terceiro stat-value)
      const perfil = await db.getStudentProfileByEmail(alunoLogado.email);
      if (perfil) {
        const skillsCount = perfil.skills ? perfil.skills.split(',').map(s => s.trim()).filter(Boolean).length : 0;
        const skillsStat = document.querySelectorAll('.stat-value')[2];
        if (skillsStat) {
          skillsStat.innerText = skillsCount;
        }
      }

      // Renderizar vagas publicadas pelas empresas
      const opportunityGrid = document.getElementById('opportunityGrid');
      if (opportunityGrid) {
        const vacancies = (await db.getAllCompanyVacancies()).filter(vaga => vaga.status === 'Ativa');
        opportunityGrid.innerHTML = '';
        if (vacancies.length === 0) {
          opportunityGrid.innerHTML = `
            <div style="grid-column: 1 / -1; padding: 30px; background: white; border-radius: 18px; border: 1px dashed #cbd5e1; text-align: center; color: #64748b; width: 100%;">
              <p style="font-weight: 500; margin-bottom: 8px;">Nenhuma vaga publicada pelas empresas ainda.</p>
              <a href="./vagas.html" style="color: #2563eb; font-weight: 600; text-decoration: none; font-size: 14px;">Ver vagas abertas</a>
            </div>
          `;
        } else {
          vacancies.slice(0, 2).forEach(vaga => {
            const article = document.createElement('article');
            article.className = 'card job';
            article.innerHTML = `
              <span class="badge">${vaga.categoria || 'Geral'}</span>
              <h3>${vaga.titulo}</h3>
              <p>${vaga.empresa || vaga.company_name || vaga.company_email || ''}</p>
              <p class="small-text">${vaga.modelo} • ${vaga.tipo}</p>
            `;
            opportunityGrid.appendChild(article);
          });
        }
      }

      // Normalizar candidaturas com base em vagas reais
      const aplicaçõesValidas = await db.normalizeStudentApplications(alunoLogado.email);

      // Renderizar candidaturas dinamicamente
      const appsRow = document.querySelector('.apps-row');
      if (appsRow) {
        const candidaturas = aplicaçõesValidas;
        appsRow.innerHTML = '';
        candidaturas.forEach(cand => {
          const card = document.createElement('article');
          card.className = 'card application';

          let statusClass = 'status-pending';
          const statusKey = cand.status.toLowerCase();
          if (statusKey === 'contratado' || statusKey === 'aceito') statusClass = 'status-accepted';
          if (statusKey === 'recusado' || statusKey === 'rejeitado') statusClass = 'status-rejected';
          if (statusKey === 'entrevista') statusClass = 'status-interview';

          let subtitleText = `Enviada em ${cand.data}`;
          if (statusKey === 'entrevista') {
            subtitleText = cand.msgExtra || `Entrevista agendada para ${cand.data}`;
          } else if (statusKey === 'contratado' || statusKey === 'aceito') {
            subtitleText = cand.msgExtra || 'Parabéns! Você foi contratado.';
          } else if (statusKey === 'recusado' || statusKey === 'rejeitado') {
            subtitleText = cand.msgExtra || 'Infelizmente sua candidatura não foi aprovada.';
          }

          card.innerHTML = `
            <div class="app-head">
              <div>
                <h3>${cand.titulo}</h3>
                <p>${cand.empresa}</p>
              </div>
              <span class="status ${statusClass}">${cand.status}</span>
            </div>
            <p class="small-text">${subtitleText}</p>
          `;
          appsRow.appendChild(card);
        });

        const statValue = document.querySelectorAll('.stat-value')[1];
        if (statValue) {
          statValue.innerText = candidaturas.length;
        }
      }

      const logoutBtn = document.querySelector('.logout');
      if (logoutBtn) {
        logoutBtn.addEventListener('click', async function (e) {
          e.preventDefault();
          const confirmar = confirm("Deseja sair da plataforma?");
          if (confirmar) {
            await db.signOut();
            window.location.href = 'login_aluno.html';
          }
        });
      }
    })();
  </script>
</body>

</html>
