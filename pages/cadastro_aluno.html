<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="../css/login_aluno.css">
    <title>Cadastro do Aluno</title>
</head>

<body>
    <header class="topo">
        <div class="logo">
            <img src="../assets/images/logo.png" alt="Logo Porto Connect">
        </div>

    </header>

    <a href="login_aluno.html" class="voltar">
        <i class='bx bx-arrow-back'></i>
        Voltar para Login
    </a>

    <main>
        <div class="container">
            <form action="home_aluno.html" method="get">
                <h1>Cadastro de Aluno</h1>
                <p class="subtitle">Crie sua conta na plataforma</p>

                <div class="input-box">
                    <label for="nome">Nome Completo</label>
                    <input id="nome" placeholder="Seu nome completo" type="text" required>
                    <i class="bx bxs-user"></i>
                </div>

                <div class="input-box">
                    <label for="email">Email</label>
                    <input id="email" placeholder="Seu email" type="email" required>
                    <i class="bx bxs-envelope"></i>
                </div>

                <div class="input-box">
                    <label for="senha">Senha</label>
                    <input id="senha" placeholder="Crie uma senha" type="password" required>
                    <i class="bx bxs-lock-alt"></i>
                </div>

                <button type="submit">Cadastrar</button>

                <div class="criar-conta">
                    <p>Já tem uma conta? <a href="login_aluno.html">Fazer login</a></p>
                </div>
            </form>
        </div>
    </main>

    <script>
        document.querySelector('form').addEventListener('submit', function(e) {
            e.preventDefault();
            const nome = document.getElementById('nome').value.trim();
            const email = document.getElementById('email').value.trim();
            const senha = document.getElementById('senha').value;

            let usuarios = JSON.parse(localStorage.getItem('usuarios_aluno') || '[]');

            if (usuarios.some(user => user.email === email)) {
                alert('Este e-mail já está cadastrado!');
                return;
            }

            const novoUsuario = {
                nome: nome,
                email: email,
                senha: senha,
                cidade: '',
                sobre: '',
                skills: ''
            };

            usuarios.push(novoUsuario);
            localStorage.setItem('usuarios_aluno', JSON.stringify(usuarios));

            localStorage.setItem('aluno_logado', JSON.stringify(novoUsuario));
            localStorage.setItem('perfilAluno', JSON.stringify(novoUsuario));

            window.location.href = 'home_aluno.html';
        });
    </script>
</body>

</html>
