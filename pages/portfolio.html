<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Meu Portfólio</title>

  <!-- CSS -->
  <link rel="stylesheet" href="../css/home_aluno.css">
  <link rel="stylesheet" href="../css/portfolio.css">

  <!-- ICONES -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="../js/init-supabase.js"></script>
  <script src="../js/db.js"></script>
  <style>
    /* Custom card modifications & actions */
    .card {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 20px rgba(0,0,0,0.05);
    }
    .card-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 20px;
      padding-top: 15px;
      border-top: 1px solid #f3f4f6;
      gap: 10px;
    }
    .card-actions a {
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: 0.2s;
    }
    .card-actions .view {
      color: #2563eb;
    }
    .card-actions .view:hover {
      color: #1d4ed8;
    }
    .card-actions .edit {
      color: #059669;
    }
    .card-actions .edit:hover {
      color: #047857;
    }
    .card-actions .delete {
      color: #dc2626;
    }
    .card-actions .delete:hover {
      color: #b91c1c;
    }

    /* Modal Detalhes do Projeto */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15,23,42,0.45);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s;
    }
    .modal-overlay.open {
      opacity: 1;
      pointer-events: all;
    }
    .modal-details {
      background: white;
      border-radius: 20px;
      padding: 35px 30px;
      max-width: 600px;
      width: 90%;
      box-shadow: 0 20px 50px rgba(15,23,42,0.15);
      transform: scale(0.9);
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      position: relative;
    }
    .modal-overlay.open .modal-details {
      transform: scale(1);
    }
    .modal-details .close-btn {
      position: absolute;
      top: 20px;
      right: 20px;
      background: none;
      border: none;
      font-size: 20px;
      color: #9ca3af;
      cursor: pointer;
      transition: 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .modal-details .close-btn:hover {
      color: #374151;
    }
    .modal-details h2 {
      font-size: 28px;
      color: #2563eb;
      margin-bottom: 15px;
      font-weight: 700;
    }
    .modal-details p {
      color: #4b5563;
      line-height: 1.7;
      margin-bottom: 20px;
      font-size: 16px;
    }
    .modal-details .section-title {
      font-weight: 700;
      color: #374151;
      margin-bottom: 8px;
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .modal-details .project-repo {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: #2563eb;
      text-decoration: none;
      font-weight: 600;
      margin-top: 15px;
    }
    .modal-details .project-repo:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>

  <!-- HEADER -->
  <header class="navbar">
    <div class="nav-inner">
      <a href="./home_aluno.html" class="brand" aria-label="Porto Connect">
        <img src="../assets/images/logo.png" alt="Porto Connect" height="34" class="brand-logo" />
      </a>

      <nav class="nav-links" id="navLinks">
        <a href="./home_aluno.html">Dashboard</a>
        <a href="./portfolio.html" class="active">Portfólio</a>
        <a href="./vagas.html">Vagas</a>
        <a href="./candidaturas.html">Candidaturas</a>
        <a href="./perfil_aluno.html">Perfil</a>
        <a href="./login_aluno.html" class="logout"><i data-lucide="log-out"></i> Sair</a>
      </nav>

      <button class="menu-toggle" id="menuToggle" aria-label="Abrir menu">
        <i data-lucide="menu"></i>
      </button>
    </div>
  </header>

  <!-- CONTEÚDO -->
  <main class="container">

    <div class="top-content">

      <div>
        <h1>Meu Portfólio</h1>
        <p>2 projetos adicionados</p>
      </div>

      <button class="btn-add" onclick="window.location.href='novo_projeto.html'">
        <i class="fa-solid fa-plus"></i>
        Adicionar projeto
      </button>

    </div>

    <!-- CARDS -->
    <div class="cards" id="projectsContainer">
      <!-- Cards serão carregados dinamicamente via JS -->
    </div>

  </main>

  <!-- Modal Detalhes do Projeto -->
  <div class="modal-overlay" id="projectDetailsModal">
    <div class="modal-details">
      <button class="close-btn" id="closeDetailsBtn">
        <i data-lucide="x"></i>
      </button>
      <h2 id="modalProjectTitle">Título do Projeto</h2>
      
      <p class="section-title">Sobre o Projeto</p>
      <p id="modalProjectDesc">Descrição do projeto...</p>
      
      <p class="section-title">Tecnologias</p>
      <div class="tags" id="modalProjectTags" style="margin-bottom: 20px;"></div>
      
      <a href="#" target="_blank" class="project-repo" id="modalProjectLink">
        <i class="fa-brands fa-github" style="font-size: 20px;"></i> Ver Repositório
      </a>
    </div>
  </div>

  <script>
    lucide.createIcons();
    document.getElementById('menuToggle')?.addEventListener('click', () => {
      document.getElementById('navLinks').classList.toggle('active');
    });

    // --- SEGURANÇA E SESSÃO ---
    const alunoLogadoRaw = localStorage.getItem('aluno_logado');
    if (!alunoLogadoRaw) {
      window.location.href = 'login_aluno.html';
    }
    const alunoLogado = JSON.parse(alunoLogadoRaw || '{}');
    const userEmail = alunoLogado.email || 'convidado';

    let projetos = [];
    const container = document.getElementById('projectsContainer');
    const projectCountText = document.querySelector('.top-content p');

    async function initProjects() {
      projetos = await db.getStudentProjects(userEmail);
      renderProjects();
    }

    function renderProjects() {
      container.innerHTML = '';
      projectCountText.innerText = `${projetos.length} projeto${projetos.length !== 1 ? 's' : ''} adicionado${projetos.length !== 1 ? 's' : ''}`;

      if (projetos.length === 0) {
        container.innerHTML = `
          <div style="text-align: center; width: 100%; padding: 40px; background: white; border-radius: 18px; border: 1px dashed #cbd5e1; color: #64748b;">
            <i class="fa-regular fa-folder-open" style="font-size: 40px; margin-bottom: 15px; display: block;"></i>
            <p style="font-size: 16px; font-weight: 500; margin-bottom: 10px;">Nenhum projeto no seu portfólio ainda.</p>
            <p style="font-size: 14px;">Adicione seu primeiro projeto clicando no botão "Adicionar projeto".</p>
          </div>
        `;
        return;
      }

      projetos.forEach((proj, idx) => {
        const card = document.createElement('div');
        card.className = 'card';
        
        // Formatar as tags
        const tagsArr = proj.tags.split(',').map(t => t.trim()).filter(Boolean);
        const tagsHTML = tagsArr.map(tag => `<span>${tag}</span>`).join('');

        card.innerHTML = `
          <div class="card-top">
            <h2>${proj.titulo}</h2>
            <i class="fa-regular fa-folder" style="color: #2563eb; font-size: 20px;"></i>
          </div>
          <p>${proj.descricao.length > 110 ? proj.descricao.substring(0, 110) + '...' : proj.descricao}</p>
          <div class="tags">${tagsHTML}</div>
          <div class="card-actions">
            <a href="#" class="view" onclick="verDetalhes(${idx}); event.preventDefault();"><i class="fa-solid fa-eye"></i> Ver mais</a>
            <a href="novo_projeto.html?edit=${idx}" class="edit"><i class="fa-solid fa-pen"></i> Editar</a>
            <a href="#" class="delete" onclick="excluirProjeto(${idx}); event.preventDefault();"><i class="fa-solid fa-trash"></i> Excluir</a>
          </div>
        `;
        container.appendChild(card);
      });
    }

    // --- FUNÇÕES DE AÇÃO ---
    window.verDetalhes = function(idx) {
      const proj = projetos[idx];
      document.getElementById('modalProjectTitle').innerText = proj.titulo;
      document.getElementById('modalProjectDesc').innerText = proj.descricao;
      
      const tagsContainer = document.getElementById('modalProjectTags');
      tagsContainer.innerHTML = '';
      proj.tags.split(',').forEach(tag => {
        if(tag.trim()){
          const span = document.createElement('span');
          span.innerText = tag.trim();
          tagsContainer.appendChild(span);
        }
      });

      const repoLink = document.getElementById('modalProjectLink');
      if (proj.link) {
        repoLink.href = proj.link;
        repoLink.style.display = 'inline-flex';
      } else {
        repoLink.style.display = 'none';
      }

      document.getElementById('projectDetailsModal').classList.add('open');
    }

    window.excluirProjeto = async function(idx) {
      if (confirm('Tem certeza que deseja excluir este projeto do seu portfólio?')) {
        const projectToDelete = projetos[idx];
        await db.deleteStudentProject(userEmail, projectToDelete.id);
        projetos.splice(idx, 1);
        renderProjects();
      }
    }

    // Fechar Modal
    document.getElementById('closeDetailsBtn').addEventListener('click', () => {
      document.getElementById('projectDetailsModal').classList.remove('open');
    });
    
    // Fechar clicando fora
    document.getElementById('projectDetailsModal').addEventListener('click', (e) => {
      if (e.target.id === 'projectDetailsModal') {
        document.getElementById('projectDetailsModal').classList.remove('open');
      }
    });

    // --- LOGOUT ---
    document.querySelector('.logout')?.addEventListener('click', async function(e) {
      e.preventDefault();
      if (confirm("Deseja sair da plataforma?")) {
        await db.signOut();
        window.location.href = 'login_aluno.html';
      }
    });

    await initProjects();
  </script>
</body>
</html>
