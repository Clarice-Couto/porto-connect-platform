<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Porto Connect - Novo Projeto</title>
<link rel="stylesheet" href="../css/home_aluno.css"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<script src="../js/db.js"></script>
<style>
.form-container { max-width: 600px; margin: 40px auto; background: white; padding: 40px; border-radius: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); }
.form-group { margin-bottom: 20px; }
.form-group label { display: block; margin-bottom: 8px; font-weight: 600; color: #374151; }
.form-group input, .form-group textarea { width: 100%; padding: 12px; border: 1px solid #d1d5db; border-radius: 10px; font-size: 15px; outline: none; transition: 0.3s; }
.form-group input:focus, .form-group textarea:focus { border-color: #2563eb; }
.form-group textarea { height: 120px; resize: vertical; }
.btn-submit { width: 100%; padding: 14px; background: #2563eb; color: white; border: none; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; transition: 0.3s; }
.btn-submit:hover { background: #1d4ed8; }
.btn-cancel { display: block; text-align: center; margin-top: 16px; color: #6b7280; text-decoration: none; font-weight: 500; }
.btn-cancel:hover { color: #374151; text-decoration: underline; }
</style>
</head>
<body>
  <header class="navbar">
    <div class="nav-inner">
      <a href="./home_aluno.html" class="brand" aria-label="Porto Connect">
        <img src="../assets/images/logo.png" alt="Porto Connect" height="34" class="brand-logo" />
      </a>

      <nav class="nav-links" id="navLinks">
        <a href="./home_aluno.html">Dashboard</a>
        <a href="./portfolio.html" class="active">Portfólio</a>
        <a href="./vagas.html">Vagas</a>
        <a href="./candidaturas.html">Candidaturas</a>
        <a href="./perfil_aluno.html">Perfil</a>
        <a href="./login_aluno.html" class="logout"><i data-lucide="log-out"></i> Sair</a>
      </nav>

      <button class="menu-toggle" id="menuToggle" aria-label="Abrir menu">
        <i data-lucide="menu"></i>
      </button>
    </div>
  </header>

  <main class="container">
    <div class="form-container">
      <h1 style="margin-bottom: 24px; font-size: 28px;">Adicionar Novo Projeto</h1>
      <form action="portfolio.html" method="get">
        <div class="form-group">
          <label for="titulo">Título do Projeto</label>
          <input type="text" id="titulo" placeholder="Ex: App de Gestão de Tarefas" required>
        </div>
        
        <div class="form-group">
          <label for="descricao">Descrição</label>
          <textarea id="descricao" placeholder="Descreva brevemente o projeto e suas funcionalidades..." required></textarea>
        </div>

        <div class="form-group">
          <label for="tags">Tecnologias Utilizadas (separadas por vírgula)</label>
          <input type="text" id="tags" placeholder="Ex: React, Node.js, MongoDB" required>
        </div>
        
        <div class="form-group">
          <label for="link">Link do Repositório (opcional)</label>
          <input type="url" id="link" placeholder="https://github.com/usuario/projeto">
        </div>

        <button type="submit" class="btn-submit">Salvar Projeto</button>
        <a href="portfolio.html" class="btn-cancel">Cancelar</a>
      </form>
    </div>
  </main>

  <script>
    lucide.createIcons();
    document.getElementById('menuToggle').addEventListener('click', () => {
      document.getElementById('navLinks').classList.toggle('active');
    });

    (async function () {
      // --- SEGURANÇA E CONTEXTO ---
      const alunoLogadoRaw = localStorage.getItem('aluno_logado');
      if (!alunoLogadoRaw) {
        window.location.href = 'login_aluno.html';
      }
      const alunoLogado = JSON.parse(alunoLogadoRaw || '{}');
      const userEmail = alunoLogado.email || 'convidado';

      const urlParams = new URLSearchParams(window.location.search);
      const editId = urlParams.get('edit');
      const isEdit = editId !== null && editId !== '';

      const pageTitle = document.querySelector('.form-container h1');
      const inputTitulo = document.getElementById('titulo');
      const inputDesc = document.getElementById('descricao');
      const inputTags = document.getElementById('tags');
      const inputLink = document.getElementById('link');
      const form = document.querySelector('form');

      let projetos = await db.getStudentProjects(userEmail);

      if (isEdit) {
        if (pageTitle) pageTitle.innerText = "Editar Projeto";
        const proj = projetos.find(project => String(project.id) === String(editId));
        if (proj) {
          inputTitulo.value = proj.titulo || '';
          inputDesc.value = proj.descricao || '';
          inputTags.value = proj.tags || '';
          inputLink.value = proj.link || '';
        }
      }

      form.addEventListener('submit', async (e) => {
        e.preventDefault();

        const novoProj = {
          id: isEdit ? editId : undefined,
          titulo: inputTitulo.value.trim(),
          descricao: inputDesc.value.trim(),
          tags: inputTags.value.trim(),
          link: inputLink.value.trim()
        };

        const result = await db.saveStudentProject(userEmail, novoProj);
        if (result.error) {
          alert(result.error.message || 'Erro ao salvar projeto. Tente novamente.');
          return;
        }

        window.location.href = 'portfolio.html';
      });

      document.querySelector('.logout')?.addEventListener('click', async function(e) {
        e.preventDefault();
        if (confirm("Deseja sair da plataforma?")) {
          await db.signOut();
          window.location.href = 'login_aluno.html';
        }
      });
    })();
  </script>
</body>
</html>
