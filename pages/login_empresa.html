<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="../css/login_empresa.css">
    <title>Login da Empresa</title>
</head>

<body>

    <header class="topo">
        <div class="logo">
            <img src="../assets/images/logo.png" alt="Logo Porto Connect">
        </div>

    </header>

    <main>
        <a href="../login.html" class="voltar">
            <i class='bx bx-arrow-back'></i>
            Voltar
        </a>

        <div class="container">
            <form action="home_empresa.html" method="get">

                <h1>Login da Empresa</h1>
                <p class="subtitle">Acesse sua conta corporativa</p>

                <div class="input-box">
                    <label for="email">Email corporativo</label>
                    <input id="email" placeholder="contato@empresa.com" type="email" required>
                    <i class="bx bxs-envelope"></i>
                </div>

                <div class="input-box">
                    <label for="senha">Senha</label>
                    <input id="senha" placeholder="Senha" type="password" required>
                    <i class="bx bxs-lock-alt"></i>
                </div>

                <div class="lembrar-esqueceu">
                    <label>
                        <input type="checkbox">
                        Lembrar-me
                    </label>
                    <a href="recuperar_senha.html">Esqueci minha senha</a>
                </div>

                <button type="submit">Entrar</button>

                <div class="criar-conta">
                    <p>Primeira vez aqui? <a href="cadastro_empresa.html">Cadastrar empresa</a></p>
                </div>

            </form>
        </div>
    </main>

    <script>
        document.querySelector('form').addEventListener('submit', function(e) {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const senha = document.getElementById('senha').value;

            let usuarios = JSON.parse(localStorage.getItem('usuarios_empresa') || '[]');

            const usuario = usuarios.find(user => user.email === email && user.senha === senha);

            if (usuario) {
                localStorage.setItem('empresa_logado', JSON.stringify(usuario));
                localStorage.setItem('perfilEmpresa', JSON.stringify(usuario));
                window.location.href = 'home_empresa.html';
            } else {
                alert('E-mail corporativo ou senha incorretos!');
            }
        });
    </script>
</body>

</html>
