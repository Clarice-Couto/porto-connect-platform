<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Perfil do Aluno</title>

  <link rel="stylesheet" href="../css/perfil.css">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
</head>
<body>

  <header class="navbar">
    <div class="logo">
      <a href="home_aluno.html"><img src="../assets/images/logo.png" alt="Logo Porto Connect"></a>
    </div>

    <nav class="nav-links">
      <a href="home_aluno.html">Dashboard</a>
 <a href="portfolio.html">Portfólio</a>
 <a href="vagas.html">Vagas</a>
 <a href="perfil_aluno.html">Perfil</a>

 <a href="login_aluno.html" id="logoutBtn">
 <i class="fa-solid fa-right-from-bracket"></i>
 Sair
 </a>
 </nav>

  </header>

 <div class="container">
 <div class="card">
 <div class="profile-top">
 <div class="profile-left">
 <div class="avatar" id="avatarText">

 </div>

 <div class="profile-info">

 <h1 id="nomePerfil"></h1>
 <div class="info-item">
 <i class="fa-regular fa-envelope"></i>
 <span id="emailPerfil"></span>
 </div>

 <div class="info-item">
 <i class="fa-solid fa-location-dot"></i>
 <span id="cidadePerfil"></span>
 </div>

 </div>

 </div>
 <button class="edit-btn" id="openModal">
 <i class="fa-regular fa-pen-to-square"></i>
  Editar perfil
 </button>

 </div>

 <div class="progress-box">

 <div class="progress-header">
 <span></span>
 <span id="porcentagemText"></span>
 </div>
 
 <div class="progress-bar">
 <div class="progress" id="progressBar"></div>
 </div>

 </div>

 <div class="tags">
 <div class="tag green"></div>
 </div>

 </div>

 <div class="card">

 <div class="section-title">
  Sobre mim
 </div>

 <p id="sobrePerfil">
   
 </p>

 </div>
 <div class="card">
 <div class="section-title">
  Habilidades
 </div>
 <div class="skills" id="skillsContainer">
 <div class="skill"></div>
 <div class="skill"></div>
 <div class="skill"></div>
 <div class="skill"></div>
 <div class="skill"></div>
 </div>
 </div>
 </div>
 <div class="modal" id="modal">
 <div class="modal-content">
 <div class="modal-header">
   <h2>Editar Perfil</h2>
   <span class="close" id="closeModal">&times;</span>
 </div>

 <div class="form-group">
   <label>Nome</label>
   <input type="text" id="inputNome">
   </div>

 <div class="form-group">
   <label>Email</label>
   <input type="email" id="inputEmail">
 </div>

 <div class="form-group">
   <label>Cidade</label>
   <input type="text" id="inputCidade">
 </div>

 <div class="form-group">
    <label>Sobre mim</label>
    <textarea id="inputSobre"></textarea>
 </div>

 <div class="form-group">
    <label>Habilidades (separadas por vírgula)</label>
    <input type="text" id="inputSkills">
 </div>

 <button class="save-btn" id="saveBtn">
   Salvar alterações
    </button>

 </div>

 </div>

 <script>

    const modal = document.getElementById("modal");
    const openModal = document.getElementById("openModal");
    const closeModal = document.getElementById("closeModal");

    const nomePerfil = document.getElementById("nomePerfil");
    const emailPerfil = document.getElementById("emailPerfil");
    const cidadePerfil = document.getElementById("cidadePerfil");
    const sobrePerfil = document.getElementById("sobrePerfil");
    const avatarText = document.getElementById("avatarText");


    const porcentagemText = document.getElementById("porcentagemText");
    const progressBar = document.getElementById("progressBar");


    const skillsContainer = document.getElementById("skillsContainer");

    const inputNome = document.getElementById("inputNome");
    const inputEmail = document.getElementById("inputEmail");
    const inputCidade = document.getElementById("inputCidade");
    const inputSobre = document.getElementById("inputSobre");
    const inputSkills = document.getElementById("inputSkills");

    openModal.addEventListener("click", () => {

      inputNome.value = nomePerfil.innerText;
      inputEmail.value = emailPerfil.innerText;
      inputCidade.value = cidadePerfil.innerText;
      inputSobre.value = sobrePerfil.innerText;

      const skills = [...document.querySelectorAll(".skill")]
        .map(skill => skill.innerText)
        .join(", ");

      inputSkills.value = skills;

      modal.style.display = "flex";
    });

    closeModal.addEventListener("click", () => {
      modal.style.display = "none";
    });

    window.addEventListener("click", (e) => {
      if(e.target === modal){
        modal.style.display = "none";
      }
    });

    document.getElementById("saveBtn").addEventListener("click", () => {

      nomePerfil.innerText = inputNome.value;
      emailPerfil.innerText = inputEmail.value;
      cidadePerfil.innerText = inputCidade.value;
      sobrePerfil.innerText = inputSobre.value;

      const partesNome = inputNome.value.split(" ");

      let iniciais = "";

      partesNome.forEach(nome => {
        iniciais += nome.charAt(0);
      });

      avatarText.innerText = iniciais.substring(0,2).toUpperCase();

      const porcentagem = parseInt(porcentagemText.innerText) || 0;
      progressBar.style.width = porcentagem + "%";

      skillsContainer.innerHTML = "";

      const skills = inputSkills.value.split(",");

      skills.forEach(skill => {

        const div = document.createElement("div");

        div.classList.add("skill");

        div.innerText = skill.trim();

        skillsContainer.appendChild(div);

      });

      const perfil = {
        nome: inputNome.value,
        email: inputEmail.value,
        cidade: inputCidade.value,
        porcentagem: porcentagem,
        sobre: inputSobre.value,
        skills: inputSkills.value
      };

      localStorage.setItem("perfilAluno", JSON.stringify(perfil));

      alert("Perfil atualizado com sucesso!");

      modal.style.display = "none";
    });

    function carregarPerfil(){

      const dados = localStorage.getItem("perfilAluno");

      if(dados){

        const perfil = JSON.parse(dados);

        nomePerfil.innerText = perfil.nome;
        emailPerfil.innerText = perfil.email;
        cidadePerfil.innerText = perfil.cidade;
        sobrePerfil.innerText = perfil.sobre;

        porcentagemText.innerText = perfil.porcentagem + "%";
        progressBar.style.width = perfil.porcentagem + "%";

        const partesNome = perfil.nome.split(" ");

        let iniciais = "";

        partesNome.forEach(nome => {
          iniciais += nome.charAt(0);
        });

        avatarText.innerText = iniciais.substring(0,2).toUpperCase();

        skillsContainer.innerHTML = "";

        const skills = perfil.skills.split(",");

        skills.forEach(skill => {

          const div = document.createElement("div");

          div.classList.add("skill");

          div.innerText = skill.trim();

          skillsContainer.appendChild(div);

        });

      }

    }

    carregarPerfil();

    document.getElementById("logoutBtn").addEventListener("click", (e) => {

      e.preventDefault();

      const confirmar = confirm("Deseja sair da plataforma?");

      if(confirmar){
        window.location.href = "../login1.html";
      }

    });

  </script>

</body>
</html>
