<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Perfil da Empresa</title>

  <link rel="stylesheet" href="../css/home_aluno.css">
  <link rel="stylesheet" href="../css/perfil.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

  <header class="navbar">
    <div class="nav-inner">
      <a href="./home_empresa.html" class="brand" aria-label="Porto Connect">
        <img src="../assets/images/logo.png" alt="Porto Connect" height="34" class="brand-logo" />
      </a>

      <nav class="nav-links" id="navLinks">
        <a href="./home_empresa.html">Candidatos</a>
        <a href="./vagas_empresa.html">Minhas Vagas</a>
        <a href="./perfil_empresa.html" class="active">Perfil</a>
        <a href="./login_empresa.html" class="logout" id="logoutBtn"><i data-lucide="log-out"></i> Sair</a>
      </nav>

      <button class="menu-toggle" id="menuToggle" aria-label="Abrir menu">
        <i data-lucide="menu"></i>
      </button>
    </div>
  </header>

  <div class="container">
    <div class="card">
      <div class="profile-top">
        <div class="profile-left">
          <div class="avatar" id="avatarText">TB</div>

          <div class="profile-info">
            <h1 id="nomePerfil">TechCorp Brasil</h1>
            <div class="info-item">
              <i class="fa-regular fa-envelope"></i>
              <span id="emailPerfil">contato@techcorp.com.br</span>
            </div>
            <div class="info-item">
              <i class="fa-solid fa-location-dot"></i>
              <span id="cidadePerfil">São Paulo, SP</span>
            </div>
          </div>
        </div>
        <button class="edit-btn" id="openModal">
          <i class="fa-regular fa-pen-to-square"></i>
          Editar perfil
        </button>
      </div>



      <div class="tags">
        <div class="tag green"></div>
      </div>
    </div>

    <div class="card">
      <div class="section-title">Sobre mim</div>
      <p id="sobrePerfil">Empresa focada no desenvolvimento de software de ponta para fintechs e saúde. Buscamos inovação constante e profissionais engajados.</p>
    </div>

    <div class="card">
      <div class="section-title">Habilidades</div>
      <div class="skills" id="skillsContainer">
        <div class="skill">React</div>
        <div class="skill">Node.js</div>
        <div class="skill">Python</div>
        <div class="skill">AWS</div>
      </div>
    </div>
  </div>

    <div class="modal" id="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Editar Perfil</h2>
        <span class="close" id="closeModal">&times;</span>
      </div>

      <div class="form-group">
        <label>Nome</label>
        <input type="text" id="inputNome">
      </div>

      <div class="form-group">
        <label>Email</label>
        <input type="email" id="inputEmail">
      </div>

      <div class="form-group">
        <label>Cidade</label>
        <input type="text" id="inputCidade">
      </div>

      <div class="form-group">
        <label>Sobre mim</label>
        <textarea id="inputSobre"></textarea>
      </div>

      <div class="form-group">
        <label>Habilidades (separadas por vírgula)</label>
        <input type="text" id="inputSkills">
      </div>

      <button class="save-btn" id="saveBtn">Salvar alterações</button>
    </div>
  </div>

  <script src="../js/init-supabase.js"></script>
  <script src="../js/db.js"></script>
  <script>
    const modal = document.getElementById("modal");
    const openModal = document.getElementById("openModal");
    const closeModal = document.getElementById("closeModal");

    const nomePerfil = document.getElementById("nomePerfil");
    const emailPerfil = document.getElementById("emailPerfil");
    const cidadePerfil = document.getElementById("cidadePerfil");
    const sobrePerfil = document.getElementById("sobrePerfil");
    const avatarText = document.getElementById("avatarText");

    const skillsContainer = document.getElementById("skillsContainer");

    const inputNome = document.getElementById("inputNome");
    const inputEmail = document.getElementById("inputEmail");
    const inputCidade = document.getElementById("inputCidade");
    const inputSobre = document.getElementById("inputSobre");
    const inputSkills = document.getElementById("inputSkills");

    openModal.addEventListener("click", () => {
      inputNome.value = nomePerfil.innerText;
      inputEmail.value = emailPerfil.innerText;
      inputCidade.value = cidadePerfil.innerText;
      inputSobre.value = sobrePerfil.innerText;

      const skills = [...document.querySelectorAll(".skill")]
        .map(skill => skill.innerText)
        .join(", ");

      inputSkills.value = skills;
      modal.style.display = "flex";
    });

    closeModal.addEventListener("click", () => {
      modal.style.display = "none";
    });

    window.addEventListener("click", (e) => {
      if(e.target === modal){
        modal.style.display = "none";
      }
    });

    document.getElementById("saveBtn").addEventListener("click", async () => {
      nomePerfil.innerText = inputNome.value;
      emailPerfil.innerText = inputEmail.value;
      cidadePerfil.innerText = inputCidade.value;
      sobrePerfil.innerText = inputSobre.value;

      const partesNome = inputNome.value.split(" ");
      let iniciais = "";
      partesNome.forEach(nome => {
        iniciais += nome.charAt(0);
      });

      avatarText.innerText = iniciais.substring(0,2).toUpperCase();

      skillsContainer.innerHTML = "";
      const skills = inputSkills.value.split(",");
      skills.forEach(skill => {
        const div = document.createElement("div");
        div.classList.add("skill");
        div.innerText = skill.trim();
        skillsContainer.appendChild(div);
      });

      const perfil = {
        nome: inputNome.value,
        email: inputEmail.value,
        cidade: inputCidade.value,
        sobre: inputSobre.value,
        skills: inputSkills.value
      };

      const empresaLogadaRaw = localStorage.getItem('empresa_logado');
      const empresa = empresaLogadaRaw ? JSON.parse(empresaLogadaRaw) : null;
      const profileToSave = { ...(empresa || {}), ...perfil };
      const res = await db.updateCompanyProfile(profileToSave);
      if (res.error) {
        alert(res.error.message || 'Erro ao atualizar perfil.');
        return;
      }
      alert('Perfil atualizado com sucesso!');
      modal.style.display = 'none';
    });

    async function carregarPerfil(){
      const empresaLogadaRaw = localStorage.getItem('empresa_logado');
      if (!empresaLogadaRaw) {
        window.location.href = 'login_empresa.html';
        return;
      }
      const empresa = JSON.parse(empresaLogadaRaw);
      // try Supabase first
      const perfil = await db.getCompanyProfileByEmail(empresa.email) || JSON.parse(localStorage.getItem('perfilEmpresa') || 'null') || empresa;

      nomePerfil.innerText = perfil.nome || '';
      emailPerfil.innerText = perfil.email || '';
      cidadePerfil.innerText = perfil.cidade || '';
      sobrePerfil.innerText = perfil.sobre || '';

      const partesNome = (perfil.nome || '').split(' ');
      let iniciais = '';
      partesNome.forEach(n => { iniciais += (n.charAt(0) || ''); });
      avatarText.innerText = iniciais.substring(0,2).toUpperCase();
      skillsContainer.innerHTML = '';
      const skills = (perfil.skills || '').split(',').map(s => s.trim()).filter(Boolean);
      if (skills.length === 0) {
        const div = document.createElement('div'); div.classList.add('skill'); div.innerText = 'Sem habilidades informadas'; skillsContainer.appendChild(div);
      } else {
        skills.forEach(skill => {
          const div = document.createElement('div'); div.classList.add('skill'); div.innerText = skill; skillsContainer.appendChild(div);
        });
      }
    }

    carregarPerfil();

    document.getElementById("logoutBtn").addEventListener("click", (e) => {
      e.preventDefault();
      const confirmar = confirm("Deseja sair da plataforma?");
      if(confirmar){
        localStorage.removeItem("empresa_logado");
        window.location.href = "login_empresa.html";
      }
    });
    
    lucide.createIcons();
    document.getElementById('menuToggle')?.addEventListener('click', () => {
      document.getElementById('navLinks').classList.toggle('active');
    });
  </script>
</body>
</html>
