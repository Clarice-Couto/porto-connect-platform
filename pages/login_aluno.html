<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="../css/login_aluno.css">
    <title>Login do Aluno</title>
</head>

<body>
    <header class="topo">
        <div class="logo">
            <img src="../assets/images/logo.png" alt="Logo Porto Connect">
        </div>

    </header>

    <a href="../login.html" class="voltar">
        <i class='bx bx-arrow-back'></i>
        Voltar
    </a>

    <main>
        <div class="container">
            <form>
                <h1>Login do Aluno</h1>
                <p class="subtitle">Acesse sua conta</p>

                <div class="input-box">
                    <label for="email">Email</label>
                    <input id="email" placeholder="Seu email" type="email" required>
                    <i class="bx bxs-envelope"></i>
                </div>

                <div class="input-box">
                    <label for="senha">Senha</label>
                    <input id="senha" placeholder="Senha" type="password" required>
                    <i class="bx bxs-lock-alt"></i>
                </div>

                <div class="lembrar-esqueceu">
                    <label>
                        <input type="checkbox">
                        Lembrar-me
                    </label>
                    <a href="recuperar_senha.html">Esqueci minha senha</a>
                </div>

                <button type="submit">Entrar</button>

                <div class="criar-conta">
                    <p>Não tem uma conta? <a href="cadastro_aluno.html">Criar conta</a></p>
                </div>
            </form>
        </div>
    </main>

    <script src="../js/db.js"></script>
    <script>
        document.querySelector('form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const senha = document.getElementById('senha').value;

            const result = await db.signInStudent(email, senha);
            if (result.error) {
                alert(result.error.message || 'E-mail ou senha incorretos!');
                return;
            }
            window.location.href = 'home_aluno.html';
        });
    </script>
</body>

</html>
