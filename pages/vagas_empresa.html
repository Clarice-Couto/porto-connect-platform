<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Porto Connect - Minhas Vagas</title>
<link rel="stylesheet" href="../css/home_aluno.css"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<script src="../js/db.js"></script>
<style>
.vagas-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 20px; margin-top: 30px; }
.card.job { display: flex; flex-direction: column; justify-content: space-between; height: 100%; position: relative; }
.job-actions { margin-top: 20px; display: flex; gap: 10px; }
.job-actions button { flex: 1; padding: 10px; border-radius: 8px; font-weight: 600; cursor: pointer; border: none; transition: 0.3s; }
.btn-edit { background: #f3f4f6; color: #4b5563; }
.btn-edit:hover { background: #e5e7eb; }
.btn-view { background: #2563eb; color: white; }
.btn-view:hover { background: #1d4ed8; }
.status-badge { position: absolute; top: 20px; right: 20px; padding: 4px 10px; border-radius: 12px; font-size: 12px; font-weight: 600; }
.status-active { background: #dcfce7; color: #166534; }
.status-closed { background: #fee2e2; color: #991b1b; }
.candidates-info { display: flex; align-items: center; gap: 8px; margin-top: 16px; color: #4b5563; font-size: 14px; font-weight: 500; }
</style>
</head>
<body>
  <header class="navbar">
    <div class="nav-inner">
      <a href="./home_empresa.html" class="brand" aria-label="Porto Connect">
        <img src="../assets/images/logo.png" alt="Porto Connect" height="34" class="brand-logo" />
      </a>

      <nav class="nav-links" id="navLinks">
        <a href="./home_empresa.html">Dashboard</a>
        <a href="./explorar_alunos.html">Banco de Talentos</a>
        <a href="./vagas_empresa.html" class="active">Minhas Vagas</a>
        <a href="./perfil_empresa.html">Perfil</a>
        <a href="./login_empresa.html" class="logout"><i data-lucide="log-out"></i> Sair</a>
      </nav>

      <button class="menu-toggle" id="menuToggle" aria-label="Abrir menu">
        <i data-lucide="menu"></i>
      </button>
    </div>
  </header>

  <main class="container">
    <section class="hero" style="padding-bottom: 20px; display: flex; justify-content: space-between; align-items: center;">
      <div>
        <h1>Minhas Vagas</h1>
        <p>Gerencie as oportunidades publicadas pela sua empresa</p>
      </div>
      <button onclick="window.location.href='nova_vaga.html'" style="padding: 12px 24px; background: #2563eb; color: white; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 8px;">
        <i data-lucide="plus"></i> Criar Vaga
      </button>
    </section>

    <section class="vagas-grid" id="jobGrid"></section>
  </main>

  <script>
    lucide.createIcons();
    document.getElementById('menuToggle').addEventListener('click', () => {
      document.getElementById('navLinks').classList.toggle('active');
    });

    (async function(){
      const empresaRaw = localStorage.getItem('empresa_logado');
      if (!empresaRaw) {
        window.location.href = 'login_empresa.html';
        return;
      }
      const empresa = JSON.parse(empresaRaw);
      const vagas = await db.getCompanyVacancies(empresa.email);
      const container = document.getElementById('jobGrid');

      if (!vagas || vagas.length === 0) {
        container.innerHTML = `
          <div style="text-align: center; padding: 40px; background: white; border-radius: 18px; border: 1px dashed #cbd5e1; color: #64748b; grid-column: 1 / -1;">
            <p style="font-size: 16px; font-weight: 500; margin-bottom: 8px;">Você ainda não publicou nenhuma vaga.</p>
            <a href="nova_vaga.html" style="color: #2563eb; font-weight: 600; text-decoration: none;">Criar sua primeira vaga</a>
          </div>
        `;
      } else {

        const apps = await db.getApplicationsByCompany(empresa.email);
        container.innerHTML = vagas.map(vaga => {
          const isActive = vaga.status === 'Ativa';
          const appCount = apps.filter(app => app.vacancy_title === vaga.titulo || app.titulo === vaga.titulo).length;
          return `
            <article class="card job">
              <span class="status-badge ${isActive ? 'status-active' : 'status-closed'}">${vaga.status}</span>
              <span class="badge" style="background: ${isActive ? '#dbeafe' : '#f3e8ff'}; color: ${isActive ? '#1e40af' : '#6b21a8'}; padding: 4px 10px; border-radius: 12px; font-size: 12px; font-weight: 600; display: inline-block; width: max-content; margin-bottom: 12px;">${vaga.categoria || ''}</span>
              <h3>${vaga.titulo}</h3>
              <p class="small-text" style="color: #6b7280; font-size: 14px; margin-top: 4px;">${vaga.modelo || ''} • ${vaga.tipo || ''}</p>
              <p style="margin-top: 12px; color: #374151; line-height: 1.6;">${vaga.descricao || ''}</p>
              <div class="candidates-info">
                <i data-lucide="users" style="width: 16px; height: 16px;"></i> ${appCount} candidatura${appCount !== 1 ? 's' : ''}
              </div>
              <div class="job-actions">
                <button class="btn-edit" onclick="window.location.href='editar_vaga.html?id=${vaga.id}'"><i data-lucide="edit-3" style="width: 16px; height: 16px; margin-bottom:-3px"></i> Editar</button>
                <button class="btn-view" onclick="window.location.href='home_empresa.html'"><i data-lucide="eye" style="width: 16px; height: 16px; margin-bottom:-3px"></i> Ver Candidatos</button>
              </div>
            </article>
          `;
        }).join('');
        lucide.createIcons();
      }
    })();
  </script>
</body>
</html>
